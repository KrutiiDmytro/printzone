services:

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    volumes:
      - .:/var/www/html
    env_file:
      - .env
      - .env.local
    depends_on:
      - database
      - mailer

  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_primary:/var/lib/postgresql/data
      - ./docker/postgres/primary/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./docker/postgres/primary/init:/docker-entrypoint-initdb.d:ro
    command: >
      postgres
        -c hba_file=/etc/postgresql/pg_hba.conf
        -c wal_level=replica
        -c max_wal_senders=3
        -c wal_keep_size=64
    ports:
      - "5432:5432"

  database-replica:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PRIMARY_HOST: database
      PRIMARY_PORT: "5432"
      REPLICATION_USER: replicator
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_replica:/var/lib/postgresql/data
      - ./docker/postgres/replica/entrypoint.sh:/entrypoint-replica.sh:ro
    entrypoint: ["sh", "/entrypoint-replica.sh"]
    depends_on:
      - database

  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_primary:
  postgres_replica:
