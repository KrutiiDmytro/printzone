name: CI/CD

# Порт усього .gitlab-ci.yml: validate → build → test → deploy.
#
# Один workflow, а не два, бо `needs` між workflow'ами в Actions не існує:
# окремий deploy.yml котив би прод незалежно від результату тестів, тоді як
# у GitLab deploy мав needs на test:unit / test:functional.
#
# Раннер self-hosted і стоїть на проді, тому:
#   • код із форку сюди не пускаємо (умова if нижче);
#   • раннер один, джоби виконуються послідовно — матриця не дає паралелізму,
#     але прибирає 18 копіпаст-джоб GitLab до однієї.

on:
  push:
    branches: [develop, 'ci/**']
  pull_request:
  workflow_dispatch:

# 1 vCPU: другий одночасний прогін тієї ж гілки лише заважає. Але на develop
# скасовувати не можна — там у прогоні живе деплой, і обрив посеред міграцій
# лишив би прод у півстані.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

env:
  PHP_IMAGE: php:8.2-cli-alpine
  LOCAL_IMAGE: task-25/php:latest
  COMPOSER_VOLUME: composer-cache-task25

  # compose.prod.yaml інтерполює це з оточення джоби — так само, як GitLab
  # робив зі своїми CI/CD variables. Порожнє значення тут означає мовчазно
  # зламаний прод (WARN "..." not set. Defaulting to blank).
  ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
  APP_SECRET: ${{ secrets.APP_SECRET }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  CART_DB_PASSWORD: ${{ secrets.CART_DB_PASSWORD }}
  CATALOG_DB_PASSWORD: ${{ secrets.CATALOG_DB_PASSWORD }}
  DELIVERY_DB_PASSWORD: ${{ secrets.DELIVERY_DB_PASSWORD }}
  EXPORT_DB_PASSWORD: ${{ secrets.EXPORT_DB_PASSWORD }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE }}
  MAILER_DSN: ${{ secrets.MAILER_DSN }}
  NOVA_POSHTA_API_KEY: ${{ secrets.NOVA_POSHTA_API_KEY }}
  ORDER_DB_PASSWORD: ${{ secrets.ORDER_DB_PASSWORD }}
  PAYMENT_DB_PASSWORD: ${{ secrets.PAYMENT_DB_PASSWORD }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
  USER_DB_PASSWORD: ${{ secrets.USER_DB_PASSWORD }}
  # Префікс GITHUB_ зарезервований і як ім'я секрету, і як ім'я env, тому
  # compose-івський ${GITHUB_CLIENT_SECRET} експортується вже всередині кроку.
  OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}

jobs:
  validate:
    if: github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, printzone-prod]
    steps:
      # Контейнери нижче пишуть у workspace як root, а actions/checkout чистить
      # теку від імені раннера → без цього кроку наступний прогін падає на
      # правах. Той самий прийом, що деплой застосовує до public/.
      - name: Повернути права на workspace
        run: |
          [ -d "$GITHUB_WORKSPACE" ] || exit 0
          docker run --rm -v "$GITHUB_WORKSPACE:/w" busybox \
            chown -R "$(id -u):$(id -g)" /w

      - uses: actions/checkout@v5

      - name: PHP syntax check
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/app" -w /app "$PHP_IMAGE" \
            sh -c "find src tests -name '*.php' -print0 | xargs -0 -P4 php -l"

      - name: composer validate
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/app" -w /app composer:2 \
            sh -c "git config --global --add safe.directory /app && composer validate --no-check-publish"

      # --locked аудитує composer.lock, а НЕ встановлений vendor/. Раннер
      # перевикористовує теку збірки, де попередні root-джоби лишають застарілий
      # vendor/; без --locked аудит читав те старе дерево і падав на вже
      # закритій адвізорі.
      - name: composer audit
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/app" -w /app composer:2 \
            sh -c "git config --global --add safe.directory /app && composer audit --locked --format=plain"

      - name: PHP CS Fixer (check, no changes)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/app" -w /app \
            -e PHP_CS_FIXER_IGNORE_ENV=1 \
            ghcr.io/php-cs-fixer/php-cs-fixer:3-php8.3 \
            check --diff --show-progress=dots

  monolith:
    if: github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, printzone-prod]
    steps:
      - name: Повернути права на workspace
        run: |
          [ -d "$GITHUB_WORKSPACE" ] || exit 0
          docker run --rm -v "$GITHUB_WORKSPACE:/w" busybox \
            chown -R "$(id -u):$(id -g)" /w

      - uses: actions/checkout@v5

      - name: Build PHP image
        run: |
          docker build -f Dockerfile.php \
            -t "task-25/php:$GITHUB_SHA" -t task-25/php:latest .

      # У GitLab кожна з трьох джоб гнала composer install заново. На 1 vCPU це
      # втричі зайва робота, тому підготовка одна на всі перевірки.
      #
      # APP_ENV=test потрібен, щоб `importmap:install` піднімав ядро з .env.test
      # (де визначено JWT_PASSPHRASE=). У dev паспфраза живе лише в .env.local,
      # якого в CI немає → контейнер не компілюється через маршрути easyadmin.
      - name: Підготовка (composer install + importmap)
        run: |
          docker volume create "$COMPOSER_VOLUME" || true
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/app" -v "$COMPOSER_VOLUME:/composer-cache" \
            -w /app -e APP_ENV=test -e COMPOSER_HOME=/composer-cache \
            "$LOCAL_IMAGE" \
            sh -c "composer install --no-interaction --no-scripts --prefer-dist --optimize-autoloader && php bin/console importmap:install && rm -rf var/cache/test && rm -f var/test.db var/test.db-wal var/test.db-shm"

      # APP_DEBUG=1 обов'язковий: phpstan-symfony читає дамп контейнера
      # (App_KernelTestDebugContainer.xml), який Symfony пише лише в debug.
      # З APP_DEBUG=0 жодного *Container.xml немає і аналіз падає.
      - name: PHPStan (level 6, with baseline)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/app" -v "$COMPOSER_VOLUME:/composer-cache" \
            -w /app -e APP_ENV=test -e APP_DEBUG=1 -e COMPOSER_HOME=/composer-cache \
            "$LOCAL_IMAGE" \
            sh -c "php bin/console cache:warmup --env=test && vendor/bin/phpstan analyse --no-progress"

      # !cancelled() — щоб падіння PHPStan не ховало результати тестів,
      # як це було в GitLab, де перевірки жили окремими джобами.
      - name: Unit tests
        if: '!cancelled()'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/reports"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/app" -v "$COMPOSER_VOLUME:/composer-cache" \
            -w /app -e APP_ENV=test -e APP_DEBUG=0 -e COMPOSER_HOME=/composer-cache \
            "$LOCAL_IMAGE" \
            php bin/phpunit --testsuite Unit --colors=never \
              --log-junit /app/reports/junit-unit.xml

      - name: Functional tests (SQLite)
        if: '!cancelled()'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/reports"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/app" -v "$COMPOSER_VOLUME:/composer-cache" \
            -w /app -e APP_ENV=test -e APP_DEBUG=0 -e COMPOSER_HOME=/composer-cache \
            "$LOCAL_IMAGE" \
            php -d memory_limit=-1 bin/phpunit --testsuite Functional --colors=never \
              --log-junit /app/reports/junit-functional.xml

      - name: JUnit reports
        if: '!cancelled()'
        uses: actions/upload-artifact@v4
        with:
          name: junit-monolith
          path: reports/*.xml
          retention-days: 7
          if-no-files-found: warn

  microservices:
    if: github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, printzone-prod]
    strategy:
      # Раннер один — джоби все одно послідовні; fail-fast лише сховав би
      # результати решти сервісів.
      fail-fast: false
      matrix:
        service:
          - catalog-service
          - user-service
          - order-service
          - cart-service
          - payment-service
          - delivery-service
          - notification-service
          - storage-service
          - export-service
    name: ${{ matrix.service }}
    steps:
      - name: Повернути права на workspace
        run: |
          [ -d "$GITHUB_WORKSPACE" ] || exit 0
          docker run --rm -v "$GITHUB_WORKSPACE:/w" busybox \
            chown -R "$(id -u):$(id -g)" /w

      - uses: actions/checkout@v5

      - name: Build ${{ matrix.service }}
        run: |
          docker build -f "services/${{ matrix.service }}/Dockerfile" \
            -t "printzone/${{ matrix.service }}:$GITHUB_SHA" \
            -t "printzone/${{ matrix.service }}:latest" \
            "services/${{ matrix.service }}"

      - name: Test ${{ matrix.service }}
        run: |
          docker volume create "$COMPOSER_VOLUME" || true
          docker run --rm \
            -v "$GITHUB_WORKSPACE/services/${{ matrix.service }}:/app" \
            -v "$COMPOSER_VOLUME:/composer-cache" \
            -w /app -e COMPOSER_HOME=/composer-cache \
            "printzone/${{ matrix.service }}:latest" \
            sh -c "composer install --no-interaction --prefer-dist --optimize-autoloader && rm -rf var/cache && vendor/bin/phpunit --colors=never"

  # ── Тир 1: ті, кому ніхто не потрібен ────────────────────────────────
  deploy-independent:
    name: deploy ${{ matrix.service }}
    # Деплоїмо лише з develop і лише після зелених перевірок. У GitLab це
    # забезпечували stages + needs на test:*; в Actions один workflow не може
    # мати needs на джоби іншого, тому пайплайн єдиний.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [validate, monolith, microservices]
    runs-on: [self-hosted, printzone-prod]
    timeout-minutes: 20
    environment:
      name: production
      url: https://e-commerce.it.com
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: cart-service,         db: db-cart,     dbname: cart_service,     pw: CART_DB_PASSWORD }
          - { service: payment-service,      db: db-payment,  dbname: payment_service,  pw: PAYMENT_DB_PASSWORD }
          - { service: delivery-service,     db: db-delivery, dbname: delivery_service, pw: DELIVERY_DB_PASSWORD }
          - { service: export-service,       db: db-export,   dbname: export_service,   pw: EXPORT_DB_PASSWORD }
          - { service: notification-service, db: '',          dbname: '',               pw: '' }
          - { service: storage-service,      db: '',          dbname: '',               pw: '' }
    steps:
      - name: Повернути права на workspace
        run: |
          [ -d "$GITHUB_WORKSPACE" ] || exit 0
          docker run --rm -v "$GITHUB_WORKSPACE:/w" busybox \
            chown -R "$(id -u):$(id -g)" /w
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deploy-service
        with:
          service: ${{ matrix.service }}
          db-service: ${{ matrix.db }}
          db-name: ${{ matrix.dbname }}
          db-password: ${{ matrix.pw && secrets[matrix.pw] || '' }}

  # ── Тир 2: order кличе payment на чекауті і слухає shipment.* від delivery ──
  deploy-order:
    name: deploy order-service
    needs: deploy-independent
    runs-on: [self-hosted, printzone-prod]
    timeout-minutes: 20
    environment:
      name: production
      url: https://e-commerce.it.com
    steps:
      - name: Повернути права на workspace
        run: |
          [ -d "$GITHUB_WORKSPACE" ] || exit 0
          docker run --rm -v "$GITHUB_WORKSPACE:/w" busybox \
            chown -R "$(id -u):$(id -g)" /w
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deploy-service
        with:
          service: order-service
          db-service: db-order
          db-name: order_service
          db-password: ${{ secrets.ORDER_DB_PASSWORD }}

  # ── Тир 3: моноліт ───────────────────────────────────────────────────
  deploy-monolith:
    name: deploy monolith
    needs: [deploy-independent, deploy-order]
    runs-on: [self-hosted, printzone-prod]
    timeout-minutes: 40
    environment:
      name: production
      url: https://e-commerce.it.com
    steps:
      - name: Повернути права на workspace
        run: |
          [ -d "$GITHUB_WORKSPACE" ] || exit 0
          docker run --rm -v "$GITHUB_WORKSPACE:/w" busybox \
            chown -R "$(id -u):$(id -g)" /w

      - uses: actions/checkout@v5

      - name: Deploy monolith
        run: |
          DEPLOY_DIR=/var/www/app
          COMPOSE="docker compose -f compose.yaml -f compose.prod.yaml"
          export GITHUB_CLIENT_SECRET="$OAUTH_GITHUB_CLIENT_SECRET"

          echo "=== Deploying to $DEPLOY_DIR ==="

          # Контейнери моноліту пишуть у public/ як root → наступний rsync під
          # непривілейованим раннером падає на mkstemp (Permission denied).
          if [ -d "$DEPLOY_DIR/public" ]; then
            echo "--- Reset public/ ownership to runner ---"
            docker run --rm -v "$DEPLOY_DIR/public:/pub" busybox \
              chown -R "$(id -u):$(id -g)" /pub
          fi

          rsync -rlpt --delete --no-owner --no-group --omit-dir-times \
            --exclude='.git' \
            --exclude='.env.local' \
            --exclude='vendor' \
            --exclude='node_modules' \
            --exclude='var/' \
            --exclude='tests/' \
            --exclude='public/assets/' \
            --exclude='public/bundles/' \
            --exclude='config/jwt' \
            "$GITHUB_WORKSPACE/" "$DEPLOY_DIR/"

          cd "$DEPLOY_DIR"

          echo "--- Removing .env.local (secrets come from Docker environment) ---"
          rm -f "$DEPLOY_DIR/.env.local"

          echo "--- Starting primary database ---"
          $COMPOSE up -d database
          i=0
          until $COMPOSE exec -T database pg_isready -U app -q; do
            i=$((i+1))
            if [ $i -ge 30 ]; then
              echo "ERROR: Primary DB not ready after 60s"
              $COMPOSE logs database --tail=30
              exit 1
            fi
            echo "Waiting for DB ($i/30)..."
            sleep 2
          done
          echo "Primary DB is ready"

          echo "--- Syncing database user password ---"
          $COMPOSE exec -T database psql -U app \
            -c "ALTER USER app WITH PASSWORD '${POSTGRES_PASSWORD}';"

          echo "--- Starting all services (pre-built image) ---"
          $COMPOSE up -d --no-build

          # Перестворюємо nginx замість `nginx -s reload`: default.conf змонтовано
          # як окремий ФАЙЛ, і rsync дає йому новий inode — контейнер, що вже
          # працює, тримає старий і reload перечитав би СТАРИЙ конфіг.
          $COMPOSE up -d --force-recreate --no-build nginx

          echo "--- Installing dependencies ---"
          $COMPOSE exec -T php composer install \
            --no-dev --no-interaction --no-scripts --prefer-dist --optimize-autoloader

          # JWT-ключі gitignored і виключені з rsync, тож прод-пара переживає
          # деплой. На чистому хості (або якщо ключі втрачено) генеруємо з
          # паспфрази; --skip-if-exists не чіпає наявну пару. Без цього моноліт
          # не підпише S2S-токени → "unable to encode the JWT token".
          echo "--- Ensuring JWT keypair exists ---"
          $COMPOSE exec -T php php bin/console lexik:jwt:generate-keypair --skip-if-exists

          i=0
          until $COMPOSE exec -T database-replica pg_isready -U app -q; do
            i=$((i+1))
            if [ $i -ge 40 ]; then
              echo "WARNING: Replica not ready after 2min — continuing"
              $COMPOSE logs database-replica --tail=20
              break
            fi
            echo "Waiting for replica ($i/40)..."
            sleep 3
          done

          echo "--- Running migrations ---"
          $COMPOSE exec -T php php bin/console doctrine:migrations:migrate --no-interaction

          echo "--- Installing bundle public assets ---"
          $COMPOSE exec -T php php bin/console assets:install

          echo "--- Compiling AssetMapper assets ---"
          $COMPOSE exec -T php php bin/console asset-map:compile

          echo "--- Clearing and warming up cache ---"
          timeout 120 $COMPOSE exec -T php php bin/console cache:clear \
            || echo "WARNING: cache:clear timed out, continuing"
          timeout 180 $COMPOSE exec -T php php bin/console cache:warmup --env=prod \
            || echo "WARNING: cache:warmup timed out, continuing"
          $COMPOSE exec -T php chown -R www-data:www-data \
            var/cache var/log public/assets public/bundles || true
          $COMPOSE exec -T php chmod -R 755 \
            var/cache var/log public/assets public/bundles || true

          echo "--- Health check ---"
          i=0
          until $COMPOSE exec -T php php bin/console about > /dev/null 2>&1; do
            i=$((i+1))
            if [ $i -ge 15 ]; then
              echo "ERROR: App health check failed after 30s"
              $COMPOSE logs php --tail=20
              exit 1
            fi
            echo "Health check attempt $i/15..."
            sleep 2
          done
          echo "Application is healthy"
          echo "=== Deploy complete ==="

  # ── Тир 4: ті, чиї теки заповнює rsync моноліту ──────────────────────
  deploy-dependent:
    name: deploy ${{ matrix.service }}
    needs: deploy-monolith
    runs-on: [self-hosted, printzone-prod]
    timeout-minutes: 20
    environment:
      name: production
      url: https://e-commerce.it.com
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: catalog-service, db: db-catalog, dbname: catalog_service, pw: CATALOG_DB_PASSWORD, seed: products }
          - { service: user-service,    db: db-user,    dbname: user_service,    pw: USER_DB_PASSWORD,    seed: users }
    steps:
      - name: Повернути права на workspace
        run: |
          [ -d "$GITHUB_WORKSPACE" ] || exit 0
          docker run --rm -v "$GITHUB_WORKSPACE:/w" busybox \
            chown -R "$(id -u):$(id -g)" /w
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deploy-service
        with:
          service: ${{ matrix.service }}
          db-service: ${{ matrix.db }}
          db-name: ${{ matrix.dbname }}
          db-password: ${{ secrets[matrix.pw] }}
          seed-table: ${{ matrix.seed }}
          # Теку вже наповнив rsync моноліту — свій не потрібен.
          self-rsync: 'false'
