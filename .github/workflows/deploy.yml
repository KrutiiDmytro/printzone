name: Deploy

# Порт стадії deploy з .gitlab-ci.yml. Раннер стоїть на самому проді, тому
# деплой — це rsync у /var/www/app + локальний docker compose, без SSH.
#
# Порядок джоб повторює граф needs з GitLab і він НЕ довільний:
#   independent → order → monolith → dependent
# Моноліт дропає таблиці замовлень (Version20260625071542) і кошика
# (Version20260703220000), тому order-service і cart-service мають бути живі
# та здорові ДО його міграцій. Якщо котрийсь із них упав — моноліт не
# запуститься і DROP не станеться.

on:
  push:
    branches: [develop]
  workflow_dispatch:

# Два деплої одночасно в одну теку = зламаний прод. Чекаємо, не скасовуємо.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

# compose.prod.yaml інтерполює ці змінні з оточення джоби — так само, як це
# робив GitLab зі своїми CI/CD variables. Порожнє значення тут означає
# мовчазно зламаний прод (WARN "..." not set. Defaulting to blank).
env:
  ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
  APP_SECRET: ${{ secrets.APP_SECRET }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  CART_DB_PASSWORD: ${{ secrets.CART_DB_PASSWORD }}
  CATALOG_DB_PASSWORD: ${{ secrets.CATALOG_DB_PASSWORD }}
  DELIVERY_DB_PASSWORD: ${{ secrets.DELIVERY_DB_PASSWORD }}
  EXPORT_DB_PASSWORD: ${{ secrets.EXPORT_DB_PASSWORD }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE }}
  MAILER_DSN: ${{ secrets.MAILER_DSN }}
  NOVA_POSHTA_API_KEY: ${{ secrets.NOVA_POSHTA_API_KEY }}
  ORDER_DB_PASSWORD: ${{ secrets.ORDER_DB_PASSWORD }}
  PAYMENT_DB_PASSWORD: ${{ secrets.PAYMENT_DB_PASSWORD }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
  USER_DB_PASSWORD: ${{ secrets.USER_DB_PASSWORD }}
  # Префікс GITHUB_ зарезервований і як ім'я секрету, і як ім'я env у Actions,
  # тому compose-івський ${GITHUB_CLIENT_SECRET} експортується вже в кроці.
  OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}

jobs:
  # ── Тир 1: ті, кому ніхто не потрібен ────────────────────────────────
  independent:
    name: deploy ${{ matrix.service }}
    runs-on: [self-hosted, printzone-prod]
    timeout-minutes: 20
    environment:
      name: production
      url: https://e-commerce.it.com
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: cart-service,         db: db-cart,     dbname: cart_service,     pw: CART_DB_PASSWORD }
          - { service: payment-service,      db: db-payment,  dbname: payment_service,  pw: PAYMENT_DB_PASSWORD }
          - { service: delivery-service,     db: db-delivery, dbname: delivery_service, pw: DELIVERY_DB_PASSWORD }
          - { service: export-service,       db: db-export,   dbname: export_service,   pw: EXPORT_DB_PASSWORD }
          - { service: notification-service, db: '',          dbname: '',               pw: '' }
          - { service: storage-service,      db: '',          dbname: '',               pw: '' }
    steps:
      - name: Повернути права на workspace
        run: |
          [ -d "$GITHUB_WORKSPACE" ] || exit 0
          docker run --rm -v "$GITHUB_WORKSPACE:/w" busybox \
            chown -R "$(id -u):$(id -g)" /w
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deploy-service
        with:
          service: ${{ matrix.service }}
          db-service: ${{ matrix.db }}
          db-name: ${{ matrix.dbname }}
          db-password: ${{ matrix.pw && secrets[matrix.pw] || '' }}

  # ── Тир 2: order кличе payment на чекауті і слухає shipment.* від delivery ──
  order:
    name: deploy order-service
    needs: independent
    runs-on: [self-hosted, printzone-prod]
    timeout-minutes: 20
    environment:
      name: production
      url: https://e-commerce.it.com
    steps:
      - name: Повернути права на workspace
        run: |
          [ -d "$GITHUB_WORKSPACE" ] || exit 0
          docker run --rm -v "$GITHUB_WORKSPACE:/w" busybox \
            chown -R "$(id -u):$(id -g)" /w
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deploy-service
        with:
          service: order-service
          db-service: db-order
          db-name: order_service
          db-password: ${{ secrets.ORDER_DB_PASSWORD }}

  # ── Тир 3: моноліт ───────────────────────────────────────────────────
  monolith:
    needs: [independent, order]
    runs-on: [self-hosted, printzone-prod]
    timeout-minutes: 40
    environment:
      name: production
      url: https://e-commerce.it.com
    steps:
      - name: Повернути права на workspace
        run: |
          [ -d "$GITHUB_WORKSPACE" ] || exit 0
          docker run --rm -v "$GITHUB_WORKSPACE:/w" busybox \
            chown -R "$(id -u):$(id -g)" /w

      - uses: actions/checkout@v5

      - name: Deploy monolith
        run: |
          DEPLOY_DIR=/var/www/app
          COMPOSE="docker compose -f compose.yaml -f compose.prod.yaml"
          export GITHUB_CLIENT_SECRET="$OAUTH_GITHUB_CLIENT_SECRET"

          echo "=== Deploying to $DEPLOY_DIR ==="

          # Контейнери моноліту пишуть у public/ як root → наступний rsync під
          # непривілейованим раннером падає на mkstemp (Permission denied).
          if [ -d "$DEPLOY_DIR/public" ]; then
            echo "--- Reset public/ ownership to runner ---"
            docker run --rm -v "$DEPLOY_DIR/public:/pub" busybox \
              chown -R "$(id -u):$(id -g)" /pub
          fi

          rsync -rlpt --delete --no-owner --no-group --omit-dir-times \
            --exclude='.git' \
            --exclude='.env.local' \
            --exclude='vendor' \
            --exclude='node_modules' \
            --exclude='var/' \
            --exclude='tests/' \
            --exclude='public/assets/' \
            --exclude='public/bundles/' \
            --exclude='config/jwt' \
            "$GITHUB_WORKSPACE/" "$DEPLOY_DIR/"

          cd "$DEPLOY_DIR"

          echo "--- Removing .env.local (secrets come from Docker environment) ---"
          rm -f "$DEPLOY_DIR/.env.local"

          echo "--- Starting primary database ---"
          $COMPOSE up -d database
          i=0
          until $COMPOSE exec -T database pg_isready -U app -q; do
            i=$((i+1))
            if [ $i -ge 30 ]; then
              echo "ERROR: Primary DB not ready after 60s"
              $COMPOSE logs database --tail=30
              exit 1
            fi
            echo "Waiting for DB ($i/30)..."
            sleep 2
          done
          echo "Primary DB is ready"

          echo "--- Syncing database user password ---"
          $COMPOSE exec -T database psql -U app \
            -c "ALTER USER app WITH PASSWORD '${POSTGRES_PASSWORD}';"

          echo "--- Starting all services (pre-built image) ---"
          $COMPOSE up -d --no-build

          # Перестворюємо nginx замість `nginx -s reload`: default.conf змонтовано
          # як окремий ФАЙЛ, і rsync дає йому новий inode — контейнер, що вже
          # працює, тримає старий і reload перечитав би СТАРИЙ конфіг.
          $COMPOSE up -d --force-recreate --no-build nginx

          echo "--- Installing dependencies ---"
          $COMPOSE exec -T php composer install \
            --no-dev --no-interaction --no-scripts --prefer-dist --optimize-autoloader

          # JWT-ключі gitignored і виключені з rsync, тож прод-пара переживає
          # деплой. На чистому хості (або якщо ключі втрачено) генеруємо з
          # паспфрази; --skip-if-exists не чіпає наявну пару. Без цього моноліт
          # не підпише S2S-токени → "unable to encode the JWT token".
          echo "--- Ensuring JWT keypair exists ---"
          $COMPOSE exec -T php php bin/console lexik:jwt:generate-keypair --skip-if-exists

          i=0
          until $COMPOSE exec -T database-replica pg_isready -U app -q; do
            i=$((i+1))
            if [ $i -ge 40 ]; then
              echo "WARNING: Replica not ready after 2min — continuing"
              $COMPOSE logs database-replica --tail=20
              break
            fi
            echo "Waiting for replica ($i/40)..."
            sleep 3
          done

          echo "--- Running migrations ---"
          $COMPOSE exec -T php php bin/console doctrine:migrations:migrate --no-interaction

          echo "--- Installing bundle public assets ---"
          $COMPOSE exec -T php php bin/console assets:install

          echo "--- Compiling AssetMapper assets ---"
          $COMPOSE exec -T php php bin/console asset-map:compile

          echo "--- Clearing and warming up cache ---"
          timeout 120 $COMPOSE exec -T php php bin/console cache:clear \
            || echo "WARNING: cache:clear timed out, continuing"
          timeout 180 $COMPOSE exec -T php php bin/console cache:warmup --env=prod \
            || echo "WARNING: cache:warmup timed out, continuing"
          $COMPOSE exec -T php chown -R www-data:www-data \
            var/cache var/log public/assets public/bundles || true
          $COMPOSE exec -T php chmod -R 755 \
            var/cache var/log public/assets public/bundles || true

          echo "--- Health check ---"
          i=0
          until $COMPOSE exec -T php php bin/console about > /dev/null 2>&1; do
            i=$((i+1))
            if [ $i -ge 15 ]; then
              echo "ERROR: App health check failed after 30s"
              $COMPOSE logs php --tail=20
              exit 1
            fi
            echo "Health check attempt $i/15..."
            sleep 2
          done
          echo "Application is healthy"
          echo "=== Deploy complete ==="

  # ── Тир 4: ті, чиї теки заповнює rsync моноліту ──────────────────────
  dependent:
    name: deploy ${{ matrix.service }}
    needs: monolith
    runs-on: [self-hosted, printzone-prod]
    timeout-minutes: 20
    environment:
      name: production
      url: https://e-commerce.it.com
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: catalog-service, db: db-catalog, dbname: catalog_service, pw: CATALOG_DB_PASSWORD, seed: products }
          - { service: user-service,    db: db-user,    dbname: user_service,    pw: USER_DB_PASSWORD,    seed: users }
    steps:
      - name: Повернути права на workspace
        run: |
          [ -d "$GITHUB_WORKSPACE" ] || exit 0
          docker run --rm -v "$GITHUB_WORKSPACE:/w" busybox \
            chown -R "$(id -u):$(id -g)" /w
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deploy-service
        with:
          service: ${{ matrix.service }}
          db-service: ${{ matrix.db }}
          db-name: ${{ matrix.dbname }}
          db-password: ${{ secrets[matrix.pw] }}
          seed-table: ${{ matrix.seed }}
          # Теку вже наповнив rsync моноліту — свій не потрібен.
          self-rsync: 'false'
