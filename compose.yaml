services:
  ###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    command: >
      postgres
      -c log_min_duration_statement=100
      -c log_statement=all
      -c shared_preload_libraries=pg_stat_statements
      -c wal_level=replica
      -c max_wal_senders=3
      -c max_replication_slots=3
      -c hba_file=/etc/postgresql/pg_hba.conf
    env_file:
      - path: .env.local
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # I should definitely change the password in production )
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}" ]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      - ./docker/postgres/primary/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./docker/postgres/primary/init:/docker-entrypoint-initdb.d:ro
      # use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
      ###< doctrine/doctrine-bundle ###

  database-replica:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    entrypoint: ["/bin/sh", "/usr/local/bin/replica-entrypoint.sh"]
    env_file:
      - path: .env.local
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      PRIMARY_HOST: database
      PRIMARY_PORT: 5432
      REPLICATION_USER: replicator
      PGDATA: /var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}" ]
      timeout: 5s
      retries: 10
      start_period: 90s
    volumes:
      - database_replica_data:/var/lib/postgresql/data:rw
      - ./docker/postgres/replica/entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
      - ./docker/postgres/replica/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    depends_on:
      database:
        condition: service_healthy

  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    image: task-25/php:latest
    env_file:
      - path: .env.local
        required: false
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - database

  worker:
    image: task-25/php:latest
    env_file:
      - path: .env.local
        required: false
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: php bin/console messenger:consume async events --time-limit=3600
    restart: unless-stopped
    depends_on:
      database:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  relay:
    image: task-25/php:latest
    env_file:
      - path: .env.local
        required: false
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: php bin/console app:outbox:relay --time-limit=3600
    restart: unless-stopped
    depends_on:
      database:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf
      - certbot_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    depends_on:
      - php

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;"

    ###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ###< symfony/mailer ###

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  ###> doctrine/doctrine-bundle ###
  database_data: ###< doctrine/doctrine-bundle ###
  database_replica_data:
  certbot_webroot:
  letsencrypt:
  rabbitmq_data:

# Pin the default network name so the monolith shares one network with the
# extracted services (catalog/user/order), which join it as
# `external: true, name: task-25_default`. Without this the network is named
# after the compose project (= deploy dir: "task-25" locally but "app" in prod),
# so the prod monolith landed on "app_default" and could not resolve
# catalog-service / order-service by hostname.
networks:
  default:
    name: task-25_default
