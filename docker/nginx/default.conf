server {
    listen 80;
    server_name e-commerce.it.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name e-commerce.it.com;
    root /var/www/html/public;

    ssl_certificate /etc/letsencrypt/live/e-commerce.it.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/e-commerce.it.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # Stripe webhook is owned by order-service (orders + payments live there).
    # Proxy the public endpoint to the service over the shared task-25_default
    # network, so the Stripe dashboard URL stays unchanged. The Docker resolver
    # + variable re-resolve the upstream, surviving order-service restarts.
    location = /stripe/webhook {
        resolver 127.0.0.11 valid=30s;
        set $order_service "order-service:80";
        proxy_pass http://$order_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
