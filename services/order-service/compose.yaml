services:
  db-order:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_service
      POSTGRES_USER: app
      POSTGRES_PASSWORD: changeme
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "order_service", "-U", "app"]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - db_order_data:/var/lib/postgresql/data:rw

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: printzone/order-service:latest
    env_file:
      - path: .env.local
        required: false
    ports:
      - "8003:80"
    volumes:
      - .:/app
      # vendor/ and var/ on fast container-local volumes, NOT the Windows bind
      # mount — otherwise autoload stat() storms exceed max_execution_time.
      - osvc_vendor:/app/vendor
      - osvc_var:/app/var
      # Shared RS256 keypair with the monolith → validates service-to-service tokens.
      - ../../config/jwt:/jwt:ro
    depends_on:
      db-order:
        condition: service_healthy

  # Transactional-outbox relay: publishes unpublished order.* events to the
  # monolith's RabbitMQ. Same image/volumes as order-service; `monolith` (the
  # monolith compose network) reaches the shared broker directly as `rabbitmq`.
  order-relay:
    image: printzone/order-service:latest
    env_file:
      - path: .env.local
        required: false
    command: php bin/console app:outbox:relay --time-limit=3600
    restart: unless-stopped
    volumes:
      - .:/app
      - osvc_vendor:/app/vendor
      - osvc_var:/app/var
      - ../../config/jwt:/jwt:ro
    networks:
      - default
      - monolith
    depends_on:
      db-order:
        condition: service_healthy

volumes:
  db_order_data:
  osvc_vendor:
  osvc_var:

networks:
  default:
  monolith:
    external: true
    name: task-25_default
