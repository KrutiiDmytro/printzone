openapi: 3.1.0

info:
  title: Order Service API
  version: "1.0.0"
  description: |
    Owns the `Order` aggregate and the checkout entrypoint for the PrintZone platform.

    Checkout creates a PENDING order, records an `OrderCreated` integration event via the
    transactional outbox (Catalog Saga reserves stock), and delegates the Stripe Checkout
    session to the Payment Service. Order status later advances through events
    (payment/shipment). Reads and checkout need any valid service token; the admin status
    change requires `ROLE_ADMIN`. Money values are integer cents.

servers:
  - url: http://localhost:8003
    description: Local (docker compose)
  - url: http://order-service
    description: In-cluster (shared network task-25_default)

tags:
  - name: Orders
  - name: Checkout
  - name: Health

security:
  - bearerAuth: []

paths:
  /api/orders:
    get:
      tags: [Orders]
      summary: List orders
      description: Read API for the monolith admin and the Export extractor.
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OrderStatus" }
        - { name: dateFrom, in: query, schema: { type: string, format: date }, description: "Inclusive lower bound." }
        - { name: dateTo, in: query, schema: { type: string, format: date }, description: "Inclusive upper bound." }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Matching orders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Get an order by id
      parameters:
        - $ref: "#/components/parameters/UuidPath"
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/orders/{id}/status:
    put:
      tags: [Orders]
      summary: Update an order's fulfilment status
      description: Admin only. Requires `ROLE_ADMIN`.
      parameters:
        - $ref: "#/components/parameters/UuidPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/OrderStatus" }
      responses:
        "200":
          description: Updated order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          description: Invalid order id or invalid status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/checkout:
    post:
      tags: [Checkout]
      summary: Create an order and a Stripe Checkout session
      description: |
        Called by the monolith with the resolved cart line items. Creates a PENDING order,
        records `OrderCreated` (outbox), and requests a Stripe Checkout session from the
        Payment Service. Returns the order id and the redirect URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, userEmail, items, shippingAddress, successUrl, cancelUrl]
              properties:
                userId: { type: string, format: uuid }
                userEmail: { type: string, format: email }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId]
                    properties:
                      productId: { type: string, format: uuid }
                      name: { type: string }
                      price: { type: integer, description: "Unit price in cents." }
                      quantity: { type: integer, minimum: 1 }
                shippingAddress:
                  type: object
                  description: Free-form address map (all values coerced to strings).
                  additionalProperties: { type: string }
                successUrl: { type: string, format: uri }
                cancelUrl: { type: string, format: uri }
      responses:
        "201":
          description: Order created; redirect the user to `url`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId: { type: string, format: uuid }
                  url: { type: string, format: uri, description: "Stripe Checkout URL." }
        "400":
          description: Missing or invalid fields.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502":
          description: Payment service is unavailable (order marked FAILED).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthLive" }

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe (checks the database)
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReady" }
        "503":
          description: A dependency is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReady" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: S2S RS256 JWT signed with the shared Lexik keypair.

  parameters:
    UuidPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed request (e.g. invalid UUID).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid bearer token.
    Forbidden:
      description: The token lacks `ROLE_ADMIN`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Order not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    OrderStatus:
      type: string
      enum: [PENDING, PAID, FAILED, PROCESSING, SHIPPED, DELIVERED, CANCELLED]

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        userEmail: { type: string, format: email }
        status: { $ref: "#/components/schemas/OrderStatus" }
        totalAmount: { type: integer, description: "Order total in cents." }
        createdAt: { type: [string, "null"], format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              productId: { type: string, format: uuid }
              productName: { type: string }
              price: { type: integer, description: "Unit price in cents." }
              quantity: { type: integer }

    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]

    HealthLive:
      type: object
      properties:
        status: { type: string, const: ok }

    HealthReady:
      type: object
      properties:
        status: { type: string, enum: [ok, error] }
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string }
              latency_ms: { type: integer }
              detail: { type: string }
