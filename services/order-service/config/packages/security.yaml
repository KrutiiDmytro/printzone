security:
    # Service-to-service tokens are signed by the monolith with the shared keypair.
    # No user database here — the caller is reconstructed from verified JWT claims.
    providers:
        jwt:
            lexik_jwt: ~

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt))/
            security: false

        # Stripe authenticates itself via the signed webhook payload, not a JWT.
        webhook:
            pattern: ^/stripe/webhook
            security: false

        api:
            pattern: ^/
            stateless: true
            provider: jwt
            jwt: ~

    access_control:
        - { path: ^/health, roles: PUBLIC_ACCESS }
        # Admin order listings (export/admin proxy) require an elevated service token.
        - { path: ^/api/orders, methods: [GET], roles: IS_AUTHENTICATED_FULLY }
        # Checkout (POST from the monolith) needs any valid service token.
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
