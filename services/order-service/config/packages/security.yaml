security:
    # Service-to-service tokens are signed by the monolith with the shared keypair.
    # No user database here — the caller is reconstructed from verified JWT claims.
    providers:
        jwt:
            lexik_jwt: ~

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt))/
            security: false

        api:
            pattern: ^/
            stateless: true
            provider: jwt
            jwt: ~

    access_control:
        - { path: ^/health, roles: PUBLIC_ACCESS }
        # Mutating an order (admin status change) requires an elevated service token.
        - { path: ^/api/orders, methods: [PUT, PATCH, DELETE], roles: ROLE_ADMIN }
        # Reads + checkout (POST from the monolith) need any valid service token.
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
