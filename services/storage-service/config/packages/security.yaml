security:
    # Service-to-service tokens are signed by the monolith with the shared keypair.
    # No user database here — the caller is reconstructed from verified JWT claims.
    providers:
        jwt:
            lexik_jwt: ~

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt))/
            security: false

        api:
            pattern: ^/
            stateless: true
            provider: jwt
            jwt: ~

    access_control:
        - { path: ^/health, roles: PUBLIC_ACCESS }
        # Writes (presign PUT, object write/delete) need an elevated service token.
        - { path: ^/api/storage, methods: [POST, PUT, DELETE], roles: ROLE_STORAGE_ADMIN }
        # Reads (object read/HEAD, list, presigned GET) need any valid service token.
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
