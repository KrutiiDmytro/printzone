# Production overlay for catalog-service. Deployed in-place under the monolith
# tree (/var/www/app/services/catalog-service), so ../../config/jwt resolves to
# the monolith's shared keypair. Reached by the monolith over the shared
# task-25_default network as `catalog-service` (no public port in prod).
services:
  db-catalog:
    environment:
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
    restart: unless-stopped

  catalog-service:
    image: printzone/catalog-service:latest
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: "postgresql://app:${CATALOG_DB_PASSWORD}@db-catalog:5432/catalog_service?serverVersion=16&charset=utf8"
      MESSENGER_EVENTS_DSN: "amqp://guest:guest@rabbitmq:5672/%2f/events"
    ports: !reset []
    restart: unless-stopped
    networks:
      - default
      - monolith

  catalog-worker:
    image: printzone/catalog-service:latest
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: "postgresql://app:${CATALOG_DB_PASSWORD}@db-catalog:5432/catalog_service?serverVersion=16&charset=utf8"
      MESSENGER_EVENTS_DSN: "amqp://guest:guest@rabbitmq:5672/%2f/events"
    restart: unless-stopped
