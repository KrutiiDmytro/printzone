services:
  db-user:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: app
      POSTGRES_PASSWORD: changeme
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "user_service", "-U", "app"]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - db_user_data:/var/lib/postgresql/data:rw

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: printzone/user-service:latest
    env_file:
      - path: .env.local
        required: false
    ports:
      - "8001:80"
    volumes:
      - .:/app
      # vendor/ and var/ live in fast container-local volumes, NOT the Windows
      # bind mount — otherwise tens of thousands of autoload stat() calls over
      # 9p/virtiofs make every request exceed PHP's max_execution_time.
      - usvc_vendor:/app/vendor
      - usvc_var:/app/var
      # Shared RS256 keypair with the monolith → issued tokens are cross-trusted.
      - ../../config/jwt:/jwt:ro
    depends_on:
      db-user:
        condition: service_healthy

volumes:
  db_user_data:
  usvc_vendor:
  usvc_var:
