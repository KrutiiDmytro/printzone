parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Entity/'
            - '../src/Message/'

    # The handler picks an extractor per export type; bind each constructor
    # argument to its concrete implementation (all three share the interface).
    App\MessageHandler\ProcessExportHandler:
        arguments:
            $productExtractor: '@App\Extractor\ProductExtractor'
            $orderExtractor: '@App\Extractor\OrderExtractor'
            $userExtractor: '@App\Extractor\UserExtractor'
            $adminEmail: '%env(ADMIN_EMAIL)%'
