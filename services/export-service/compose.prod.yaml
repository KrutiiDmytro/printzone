# Production overlay for export-service. Deployed in-place under the monolith
# tree (/var/www/app/services/export-service), so ../../config/jwt resolves to
# the monolith's shared keypair. Reached over the shared task-25_default network
# as `export-service` (no public port in prod). Async job generation runs in the
# export-worker; results are written to storage-service.
services:
  db-export:
    environment:
      POSTGRES_PASSWORD: ${EXPORT_DB_PASSWORD}
    restart: unless-stopped

  export-service:
    image: printzone/export-service:latest
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: "postgresql://app:${EXPORT_DB_PASSWORD}@db-export:5432/export_service?serverVersion=16&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=true"
      # Signs S2S tokens for the extractors/storage client → needs the passphrase.
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      CATALOG_SERVICE_URL: "http://catalog-service"
      ORDER_SERVICE_URL: "http://order-service"
      USER_SERVICE_URL: "http://user-service"
      STORAGE_SERVICE_URL: "http://storage-service"
      MAILER_DSN: ${MAILER_DSN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    ports: !reset []
    restart: unless-stopped
    networks:
      - default
      - monolith

  export-worker:
    image: printzone/export-service:latest
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: "postgresql://app:${EXPORT_DB_PASSWORD}@db-export:5432/export_service?serverVersion=16&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=true"
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      CATALOG_SERVICE_URL: "http://catalog-service"
      ORDER_SERVICE_URL: "http://order-service"
      USER_SERVICE_URL: "http://user-service"
      STORAGE_SERVICE_URL: "http://storage-service"
      MAILER_DSN: ${MAILER_DSN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    restart: unless-stopped
    networks:
      - default
      - monolith

networks:
  monolith:
    external: true
    name: task-25_default
