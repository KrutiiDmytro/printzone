services:
  db-delivery:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: delivery_service
      POSTGRES_USER: app
      POSTGRES_PASSWORD: changeme
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "delivery_service", "-U", "app"]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - db_delivery_data:/var/lib/postgresql/data:rw

  delivery-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: printzone/delivery-service:latest
    env_file:
      - path: .env.local
        required: false
    ports:
      - "8006:80"
    volumes:
      - .:/app
      # vendor/ and var/ on fast container-local volumes, NOT the Windows bind
      # mount — otherwise autoload stat() storms exceed max_execution_time.
      - dsvc_vendor:/app/vendor
      - dsvc_var:/app/var
      # Shared RS256 keypair with the monolith → validates service-to-service tokens.
      - ../../config/jwt:/jwt:ro
    depends_on:
      db-delivery:
        condition: service_healthy

  # Consumes order.OrderPaid from the monolith's RabbitMQ (own queue, bound to
  # order.OrderPaid) → creates shipments. Joins the monolith network to reach the
  # shared broker directly as `rabbitmq`.
  delivery-worker:
    image: printzone/delivery-service:latest
    env_file:
      - path: .env.local
        required: false
    command: php bin/console messenger:consume delivery_events --time-limit=3600
    restart: unless-stopped
    healthcheck:
      disable: true
    volumes:
      - .:/app
      - dsvc_vendor:/app/vendor
      - dsvc_var:/app/var
      - ../../config/jwt:/jwt:ro
    networks:
      - default
      - monolith
    depends_on:
      db-delivery:
        condition: service_healthy

  # Transactional-outbox relay: publishes unpublished shipment.* events to the
  # monolith's RabbitMQ. Same image/volumes as delivery-service.
  delivery-relay:
    image: printzone/delivery-service:latest
    env_file:
      - path: .env.local
        required: false
    command: php bin/console app:outbox:relay --time-limit=3600
    restart: unless-stopped
    healthcheck:
      disable: true
    volumes:
      - .:/app
      - dsvc_vendor:/app/vendor
      - dsvc_var:/app/var
      - ../../config/jwt:/jwt:ro
    networks:
      - default
      - monolith
    depends_on:
      db-delivery:
        condition: service_healthy

volumes:
  db_delivery_data:
  dsvc_vendor:
  dsvc_var:

networks:
  default:
  monolith:
    external: true
    name: task-25_default
