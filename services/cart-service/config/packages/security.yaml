security:
    # Service-to-service tokens are signed by the monolith with the shared keypair.
    # No user database here — the caller is reconstructed from verified JWT claims.
    providers:
        jwt:
            lexik_jwt: ~

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt))/
            security: false

        api:
            pattern: ^/
            stateless: true
            provider: jwt
            jwt: ~

    access_control:
        - { path: ^/health, roles: PUBLIC_ACCESS }
        # Mutating a cart (the monolith writing on a user's behalf) needs an elevated service token.
        - { path: ^/api/carts, methods: [POST, PATCH, DELETE], roles: ROLE_CART_ADMIN }
        # Reads need any valid service token.
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
