services:
  nginx:
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - certbot_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

  mailer:
    ports: []

  php:
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"

  worker:
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
