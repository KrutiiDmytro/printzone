# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    assets:
        # nginx serves static files as immutable for 30 days, so a filename that
        # survives a release would keep serving the old content from the browser
        # cache. Versioning by mtime busts exactly the files a deploy changed.
        version_strategy: App\Asset\MtimeVersionStrategy

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
