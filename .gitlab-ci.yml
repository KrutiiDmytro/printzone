    - docker run --rm
      -v "$CI_PROJECT_DIR/services/export-service:/app"
      -v "composer-cache-task25:/composer-cache"
      -w /app
      -e COMPOSER_HOME=/composer-cache
      printzone/export-service:latest
      sh -c "composer install --no-interaction --prefer-dist --optimize-autoloader && rm -rf var/cache && vendor/bin/phpunit --colors=never"
  rules: *rules_mr_develop

deploy:catalog-service:
  stage: deploy
  timeout: 20 minutes
  environment:
    name: production
    url: https://e-commerce.it.com
  variables:
    CSVC: "docker compose -f compose.yaml -f compose.prod.yaml"
  script:
    - cd "$DEPLOY_DIR/services/catalog-service"
    - echo "--- Starting db-catalog ---"
    - $CSVC up -d db-catalog
    - |
      i=0
      until $CSVC exec -T db-catalog pg_isready -U app -d catalog_service -q; do
        i=$((i+1)); [ $i -ge 30 ] && { echo "ERROR: db-catalog not ready"; $CSVC logs db-catalog --tail=20; exit 1; }
        echo "Waiting for db-catalog ($i/30)..."; sleep 2
      done
    - $CSVC exec -T db-catalog psql -U app -d catalog_service -c "ALTER USER app WITH PASSWORD '${CATALOG_DB_PASSWORD}';"
    - echo "--- Starting service (pre-built image) ---"
    - $CSVC up -d --no-build
    - $CSVC exec -T catalog-service composer install --no-dev --no-interaction --no-scripts --prefer-dist --optimize-autoloader
    # Rebuild the prod cache (persisted in csvc_var) so newly installed bundles
    # (e.g. fixtures) register their console commands before we use them. prod
    # does not auto-rebuild a stale cache.
    - $CSVC exec -T catalog-service php bin/console cache:clear --env=prod
    - echo "--- Migrations ---"
    - $CSVC exec -T catalog-service php bin/console doctrine:migrations:migrate --no-interaction
    - echo "--- Seed only if empty (catalog is source of truth) ---"
    - |
      COUNT=$($CSVC exec -T db-catalog psql -U app -d catalog_service -tAc "SELECT count(*) FROM products" 2>/dev/null | tr -d '[:space:]')
      if [ -z "$COUNT" ] || [ "$COUNT" = "0" ]; then
        echo "Empty catalog — loading fixtures"; $CSVC exec -T catalog-service php bin/console doctrine:fixtures:load --no-interaction
      else
        echo "Catalog has $COUNT products — skip seeding"
      fi
    - echo "--- Health check ---"
    - |
      i=0
      until $CSVC exec -T catalog-service php bin/console about > /dev/null 2>&1; do
        i=$((i+1)); [ $i -ge 15 ] && { echo "ERROR: catalog-service health failed"; $CSVC logs catalog-service --tail=20; exit 1; }
        echo "Health attempt $i/15..."; sleep 2
      done
      echo "catalog-service healthy"
  needs:
    - test:catalog-service
    - deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy:user-service:
  stage: deploy
  timeout: 20 minutes
  environment:
    name: production
    url: https://e-commerce.it.com
  variables:
    USVC: "docker compose -f compose.yaml -f compose.prod.yaml"
  script:
    - cd "$DEPLOY_DIR/services/user-service"
    - echo "--- Starting db-user ---"
    - $USVC up -d db-user
    - |
      i=0
      until $USVC exec -T db-user pg_isready -U app -d user_service -q; do
        i=$((i+1)); [ $i -ge 30 ] && { echo "ERROR: db-user not ready"; $USVC logs db-user --tail=20; exit 1; }
        echo "Waiting for db-user ($i/30)..."; sleep 2
      done
    - $USVC exec -T db-user psql -U app -d user_service -c "ALTER USER app WITH PASSWORD '${USER_DB_PASSWORD}';"
    - echo "--- Starting service (pre-built image) ---"
    - $USVC up -d --no-build
    - $USVC exec -T user-service composer install --no-dev --no-interaction --no-scripts --prefer-dist --optimize-autoloader
    # Rebuild the prod cache (persisted in usvc_var) so newly installed bundles
    # (e.g. fixtures) register their console commands before we use them. prod
    # does not auto-rebuild a stale cache.
    - $USVC exec -T user-service php bin/console cache:clear --env=prod
    - echo "--- Migrations ---"
    - $USVC exec -T user-service php bin/console doctrine:migrations:migrate --no-interaction
    - echo "--- Seed only if empty ---"
    - |
      COUNT=$($USVC exec -T db-user psql -U app -d user_service -tAc "SELECT count(*) FROM users" 2>/dev/null | tr -d '[:space:]')
      if [ -z "$COUNT" ] || [ "$COUNT" = "0" ]; then
        echo "Empty users — loading fixtures"; $USVC exec -T user-service php bin/console doctrine:fixtures:load --no-interaction
      else
        echo "Users table has $COUNT rows — skip seeding"
      fi
    - echo "--- Health check ---"
    - |
      i=0
      until $USVC exec -T user-service php bin/console about > /dev/null 2>&1; do
        i=$((i+1)); [ $i -ge 15 ] && { echo "ERROR: user-service health failed"; $USVC logs user-service --tail=20; exit 1; }
        echo "Health attempt $i/15..."; sleep 2
      done
      echo "user-service healthy"
  needs:
    - test:user-service
    - deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy:order-service:
  stage: deploy
  timeout: 20 minutes
  environment:
    name: production
    url: https://e-commerce.it.com
  variables:
    OSVC: "docker compose -f compose.yaml -f compose.prod.yaml"
  script:
    # Fail fast (before the monolith DROP, which needs this job) if the DB
    # password is missing — otherwise order-service comes up unreachable.
    - |
      if [ -z "$ORDER_DB_PASSWORD" ]; then
        echo "ERROR: ORDER_DB_PASSWORD is not set. Aborting before the monolith DROP."; exit 1
      fi
    # order-service deploys BEFORE the monolith, so the monolith's rsync has not
    # populated $DEPLOY_DIR/services/order-service yet (on the first deploy the
    # directory does not exist at all). Sync our own subtree first — idempotent;
    # the monolith rsync re-syncs the same files later and skips vendor/ + var/.
    - mkdir -p "$DEPLOY_DIR/services/order-service"
    - rsync -rlpt --delete --no-owner --no-group --omit-dir-times
      --exclude='.git'
      --exclude='.env.local'
      --exclude='vendor'
      --exclude='var/'
      "$CI_PROJECT_DIR/services/order-service/" "$DEPLOY_DIR/services/order-service/"
    - cd "$DEPLOY_DIR/services/order-service"
    - echo "--- Starting db-order ---"
    - $OSVC up -d db-order
    - |
      i=0
      until $OSVC exec -T db-order pg_isready -U app -d order_service -q; do
        i=$((i+1)); [ $i -ge 30 ] && { echo "ERROR: db-order not ready"; $OSVC logs db-order --tail=20; exit 1; }
        echo "Waiting for db-order ($i/30)..."; sleep 2
      done
    - $OSVC exec -T db-order psql -U app -d order_service -c "ALTER USER app WITH PASSWORD '${ORDER_DB_PASSWORD}';"
    - echo "--- Starting service + relay (pre-built image) ---"
    - $OSVC up -d --no-build
    - $OSVC exec -T order-service composer install --no-dev --no-interaction --no-scripts --prefer-dist --optimize-autoloader
    # Rebuild the prod cache (persisted in osvc_var) so the container is warm
    # before migrations/health; prod does not auto-rebuild a stale cache.
    - $OSVC exec -T order-service php bin/console cache:clear --env=prod
    - echo "--- Migrations ---"
    - $OSVC exec -T order-service php bin/console doctrine:migrations:migrate --no-interaction
    # Orders are created at runtime — no seeding in prod.
    - echo "--- Health check ---"
    - |
      i=0
      until $OSVC exec -T order-service php bin/console about > /dev/null 2>&1; do
        i=$((i+1)); [ $i -ge 15 ] && { echo "ERROR: order-service health failed"; $OSVC logs order-service --tail=20; exit 1; }
        echo "Health attempt $i/15..."; sleep 2
      done
      echo "order-service healthy"
  # Deploy order-service FIRST (independently of the monolith), so it is live
  # and healthy before the monolith cutover drops its order tables. It also calls
  # payment-service at checkout (must be live first) and consumes shipment.* from
  # delivery-service to advance the order lifecycle (deploy delivery-service first).
  needs:
    - test:order-service
    - deploy:payment-service
    - deploy:delivery-service
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

