stages:
  - validate
  - test
  - build
  - deploy

default:
  tags:
    - Веб-разработка

variables:
  DEPLOY_DIR: /var/www/app
  DEPLOY_USER: deploy
  PHP_IMAGE: php:8.2-cli-alpine
  COMPOSER_IMAGE: composer:2
  COMPOSE: "docker compose -f compose.yaml -f compose.prod.yaml"
  # Без -x: не чіпаємо gitignored директорії (vendor/, var/, .phpunit.cache/ тощо)
  # що створені Docker-контейнерами від root і не можуть бути видалені runner-користувачем
  GIT_CLEAN_FLAGS: -ffd

# ─────────────────────────────────────────────────────────────
# VALIDATE
# Швидкі статичні перевірки без залежностей
# ─────────────────────────────────────────────────────────────

lint:php:
  stage: validate
  script:
    - echo "=== PHP syntax check ==="
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -w /app \
        $PHP_IMAGE \
        sh -c "find src tests -name '*.php' | xargs php -l | grep -v 'No syntax errors' || true && echo 'All files OK'"
  only:
    - develop

composer:validate:
  stage: validate
  script:
    - echo "=== Validating composer.json ==="
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -w /app \
        $COMPOSER_IMAGE \
        validate --strict --no-check-publish
  only:
    - develop

# ─────────────────────────────────────────────────────────────
# TEST
# Ізольовані контейнери з SQLite (без PostgreSQL)
# ─────────────────────────────────────────────────────────────

.test_base:
  stage: test
  before_script:
    # Кешуємо vendor/ у іменованому Docker volume між запусками
    - docker volume create composer-cache-task24 || true
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -v "composer-cache-task24:/composer-cache" \
        -w /app \
        -e COMPOSER_HOME=/composer-cache \
        $COMPOSER_IMAGE \
        install --no-interaction --prefer-dist --optimize-autoloader
  only:
    - develop

test:unit:
  extends: .test_base
  script:
    - echo "=== Unit Tests ==="
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -v "composer-cache-task24:/composer-cache" \
        -w /app \
        -e APP_ENV=test \
        -e COMPOSER_HOME=/composer-cache \
        $PHP_IMAGE \
        sh -c "
          apk add --no-cache libsodium-dev icu-dev libzip-dev sqlite &&
          docker-php-ext-install intl zip sodium &&
          php bin/phpunit --testsuite Unit --colors=never
        "

test:functional:
  extends: .test_base
  script:
    - echo "=== Functional Tests (SQLite) ==="
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -v "composer-cache-task24:/composer-cache" \
        -w /app \
        -e APP_ENV=test \
        -e COMPOSER_HOME=/composer-cache \
        $PHP_IMAGE \
        sh -c "
          apk add --no-cache libsodium-dev icu-dev libzip-dev sqlite &&
          docker-php-ext-install intl zip sodium &&
          php bin/phpunit --testsuite Functional --colors=never
        "

# ─────────────────────────────────────────────────────────────
# BUILD
# Збираємо Docker образ та пушимо в GitLab Registry
# ─────────────────────────────────────────────────────────────

build:image:
  stage: build
  script:
    - echo "=== Building PHP image locally ==="
    - docker build
      -f Dockerfile.php
      -t task-25/php:$CI_COMMIT_SHA
      -t task-25/php:latest
      --cache-from task-25/php:latest
      .
    - echo "Image built task-25/php:$CI_COMMIT_SHA"
  needs:
    - test:unit
    - test:functional
  only:
    - develop

# ─────────────────────────────────────────────────────────────
# DEPLOY
# Розгортання на сервер після успішних тестів та збірки
# ─────────────────────────────────────────────────────────────

deploy:
  stage: deploy
  timeout: 10 minutes
  environment:
    name: production
    url: https://e-commerce.it.com
  script:
    - echo "=== Deploying to $DEPLOY_DIR ==="

    # Синхронізуємо файли локально (runner на тому самому сервері)
    - rsync -a --delete
      --exclude='.git'
      --exclude='.env.local'
      --exclude='vendor'
      --exclude='node_modules'
      --exclude='var/cache'
      --exclude='var/log'
      "$CI_PROJECT_DIR/" "$DEPLOY_DIR/"

    - cd "$DEPLOY_DIR"

    # Source .env.local so ${POSTGRES_PASSWORD} is available for compose substitution
    - set -a && source .env.local && set +a

    - echo "--- Starting primary database ---"
    - $COMPOSE up -d database
    - |
      i=0
      until $COMPOSE exec -T database pg_isready -U app -q; do
        i=$((i+1))
        if [ $i -ge 30 ]; then
          echo "ERROR: Primary DB not ready after 60s"
          $COMPOSE logs database --tail=30
          exit 1
        fi
        echo "Waiting for DB ($i/30)..."
        sleep 2
      done
      echo "Primary DB is ready"

    - echo "--- Starting all services ---"
    - $COMPOSE up -d

    - echo "--- Installing dependencies ---"
    - $COMPOSE exec -T php composer install
      --no-interaction --no-scripts --prefer-dist --optimize-autoloader

    - |
      i=0
      until $COMPOSE exec -T database-replica pg_isready -U app -q; do
        i=$((i+1))
        if [ $i -ge 40 ]; then
          echo "WARNING: Replica not ready after 2min — continuing"
          $COMPOSE logs database-replica --tail=20
          break
        fi
        echo "Waiting for replica ($i/40)..."
        sleep 3
      done

    - echo "--- Running migrations ---"
    - $COMPOSE exec -T php php bin/console doctrine:migrations:migrate --no-interaction

    - echo "--- Clearing cache ---"
    - $COMPOSE exec -T php php bin/console cache:clear --no-warmup

    - echo "--- Health check ---"
    - sleep 3
    - $COMPOSE exec -T php php bin/console about
    - echo "=== Deploy complete ==="

  needs:
    - build:image
  only:
    - develop
