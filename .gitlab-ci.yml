stages:
  - validate
  - build
  - test
  - deploy

default:
  tags:
    - Веб-разработка

variables:
  DEPLOY_DIR: /var/www/app
  DEPLOY_USER: deploy
  PHP_IMAGE: php:8.2-cli-alpine
  COMPOSE: "docker compose -f compose.yaml -f compose.prod.yaml"
  GIT_CLEAN_FLAGS: -ffd
  LOCAL_IMAGE: task-25/php:latest

# Пайплайн створюється на Merge Request і на гілці develop (без дублювання)
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# Спільні правила: перевірки бігають на MR (до мерджа) і на develop
.rules_mr_develop: &rules_mr_develop
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == "develop"'

# ─────────────────────────────────────────────────────────────
# VALIDATE
# Швидкі статичні перевірки — один docker run з PHP_IMAGE
# ─────────────────────────────────────────────────────────────

lint:php:
  stage: validate
  script:
    - echo "=== PHP syntax check ==="
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -w /app \
        $PHP_IMAGE \
        sh -c "find src tests -name '*.php' -print0 | xargs -0 -P4 php -l"
    - echo "=== Validating composer.json ==="
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -w /app \
        composer:2 \
        sh -c "git config --global --add safe.directory /app && composer validate --no-check-publish"
  rules: *rules_mr_develop

audit:composer:
  stage: validate
  script:
    - echo "=== Composer security audit ==="
    # --locked audits composer.lock, NOT the installed vendor/. The shell runner
    # reuses its build dir, where earlier root-running docker jobs leave a stale
    # root-owned vendor/; without --locked the audit read that old tree (2.8.0)
    # instead of the committed lock and failed on an already-patched advisory.
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -w /app \
        composer:2 \
        sh -c "git config --global --add safe.directory /app && composer audit --locked --format=plain"
  rules: *rules_mr_develop

cs:fixer:
  stage: validate
  script:
    - echo "=== PHP CS Fixer (check, no changes) ==="
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -w /app \
        -e PHP_CS_FIXER_IGNORE_ENV=1 \
        ghcr.io/php-cs-fixer/php-cs-fixer:3-php8.3 \
        check --diff --show-progress=dots
  needs: []
  rules: *rules_mr_develop

# ─────────────────────────────────────────────────────────────
# BUILD
# Збираємо локальний образ паралельно з validate (needs: [])
# ─────────────────────────────────────────────────────────────

build:image:
  stage: build
  script:
    - echo "=== Building PHP image locally ==="
    - docker build
      -f Dockerfile.php
      -t task-25/php:$CI_COMMIT_SHA
      -t task-25/php:latest
      .
    - echo "Image built task-25/php:$CI_COMMIT_SHA"
  needs: []
  rules: *rules_mr_develop

# ─────────────────────────────────────────────────────────────
# TEST
# Використовує локальний образ — жодного pull з Docker Hub
# ─────────────────────────────────────────────────────────────

.test_base:
  stage: test
  before_script:
    - docker volume create composer-cache-task25 || true
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -v "composer-cache-task25:/composer-cache" \
        -w /app \
        -e COMPOSER_HOME=/composer-cache \
        $LOCAL_IMAGE \
        sh -c "composer install --no-interaction --no-scripts --prefer-dist --optimize-autoloader && php bin/console importmap:install && rm -rf var/cache/test && rm -f var/test.db var/test.db-wal var/test.db-shm"
  needs:
    - build:image
  rules: *rules_mr_develop

static:analysis:
  extends: .test_base
  script:
    - echo "=== PHPStan (level 6, with baseline) ==="
    # APP_DEBUG=1 is required: phpstan-symfony reads the container XML dump
    # (App_KernelTestDebugContainer.xml), which Symfony only writes in debug mode.
    # With APP_DEBUG=0 no *Container.xml is produced and the analysis fails.
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -v "composer-cache-task25:/composer-cache" \
        -w /app \
        -e APP_ENV=test \
        -e APP_DEBUG=1 \
        -e COMPOSER_HOME=/composer-cache \
        $LOCAL_IMAGE \
        sh -c "php bin/console cache:warmup --env=test && vendor/bin/phpstan analyse --no-progress"

test:unit:
  extends: .test_base
  script:
    - echo "=== Unit Tests ==="
    - mkdir -p "$CI_PROJECT_DIR/reports"
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -v "composer-cache-task25:/composer-cache" \
        -w /app \
        -e APP_ENV=test \
        -e APP_DEBUG=0 \
        -e COMPOSER_HOME=/composer-cache \
        $LOCAL_IMAGE \
        php bin/phpunit --testsuite Unit --colors=never --log-junit /app/reports/junit-unit.xml
  artifacts:
    when: always
    reports:
      junit: reports/junit-unit.xml
    expire_in: 7 days

test:functional:
  extends: .test_base
  script:
    - echo "=== Functional Tests (SQLite) ==="
    - mkdir -p "$CI_PROJECT_DIR/reports"
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -v "composer-cache-task25:/composer-cache" \
        -w /app \
        -e APP_ENV=test \
        -e APP_DEBUG=0 \
        -e COMPOSER_HOME=/composer-cache \
        $LOCAL_IMAGE \
        php -d memory_limit=-1 bin/phpunit --testsuite Functional --colors=never --log-junit /app/reports/junit-functional.xml
  artifacts:
    when: always
    reports:
      junit: reports/junit-functional.xml
    expire_in: 7 days

# ─────────────────────────────────────────────────────────────
# DEPLOY
# ─────────────────────────────────────────────────────────────

deploy:
  stage: deploy
  timeout: 40 minutes
  environment:
    name: production
    url: https://e-commerce.it.com
  script:
    - echo "=== Deploying to $DEPLOY_DIR ==="

    # Контейнери моноліту пишуть у public/ як root → наступний rsync під
    # неприлегованим runner'ом падає на mkstemp (Permission denied). Перед
    # синхронізацією повертаємо власника назад на runner через root-контейнер.
    - |
      if [ -d "$DEPLOY_DIR/public" ]; then
        echo "--- Reset public/ ownership to runner (containers wrote as root) ---"
        docker run --rm -v "$DEPLOY_DIR/public:/pub" busybox \
          chown -R "$(id -u):$(id -g)" /pub
      fi

    - rsync -rlpt --delete --no-owner --no-group --omit-dir-times
      --exclude='.git'
      --exclude='.env.local'
      --exclude='vendor'
      --exclude='node_modules'
      --exclude='var/'
      --exclude='tests/'
      --exclude='public/assets/'
      --exclude='public/bundles/'
      "$CI_PROJECT_DIR/" "$DEPLOY_DIR/"

    - cd "$DEPLOY_DIR"

    - echo "--- Removing .env.local (all secrets passed via Docker environment) ---"
    - rm -f "$DEPLOY_DIR/.env.local"

    - echo "--- Starting primary database ---"
    - $COMPOSE up -d database
    - |
      i=0
      until $COMPOSE exec -T database pg_isready -U app -q; do
        i=$((i+1))
        if [ $i -ge 30 ]; then
          echo "ERROR: Primary DB not ready after 60s"
          $COMPOSE logs database --tail=30
          exit 1
        fi
        echo "Waiting for DB ($i/30)..."
        sleep 2
      done
      echo "Primary DB is ready"

    - echo "--- Syncing database user password with POSTGRES_PASSWORD ---"
    - $COMPOSE exec -T database psql -U app -c "ALTER USER app WITH PASSWORD '${POSTGRES_PASSWORD}';"

    - echo "--- Starting all services (using pre-built image from CI) ---"
    - $COMPOSE up -d --no-build
    - $COMPOSE exec -T nginx nginx -s reload

    - echo "--- Installing dependencies ---"
    - $COMPOSE exec -T php composer install
      --no-dev --no-interaction --no-scripts --prefer-dist --optimize-autoloader

    - |
      i=0
      until $COMPOSE exec -T database-replica pg_isready -U app -q; do
        i=$((i+1))
        if [ $i -ge 40 ]; then
          echo "WARNING: Replica not ready after 2min — continuing"
          $COMPOSE logs database-replica --tail=20
          break
        fi
        echo "Waiting for replica ($i/40)..."
        sleep 3
      done

    - echo "--- Running migrations ---"
    - $COMPOSE exec -T php php bin/console doctrine:migrations:migrate --no-interaction

    - echo "--- Installing bundle public assets ---"
    - $COMPOSE exec -T php php bin/console assets:install

    - echo "--- Compiling AssetMapper assets ---"
    - $COMPOSE exec -T php php bin/console asset-map:compile

    - echo "--- Clearing and warming up cache ---"
    - |
      timeout 120 $COMPOSE exec -T php php bin/console cache:clear \
        || echo "WARNING: cache:clear timed out, continuing"
      timeout 180 $COMPOSE exec -T php php bin/console cache:warmup --env=prod \
        || echo "WARNING: cache:warmup timed out, continuing"
      $COMPOSE exec -T php chown -R www-data:www-data var/cache var/log public/assets public/bundles || true
      $COMPOSE exec -T php chmod -R 755 var/cache var/log public/assets public/bundles || true

    - echo "--- Health check ---"
    - |
      i=0
      until $COMPOSE exec -T php php bin/console about > /dev/null 2>&1; do
        i=$((i+1))
        if [ $i -ge 15 ]; then
          echo "ERROR: App health check failed after 30s"
          $COMPOSE logs php --tail=20
          exit 1
        fi
        echo "Health check attempt $i/15..."
        sleep 2
      done
      echo "Application is healthy"
    - echo "=== Deploy complete ==="

  # order-service must be deployed & healthy BEFORE this job's migrations run —
  # Version20260625071542 DROPs the monolith order tables, so the new source of
  # truth has to be live first. If deploy:order-service fails (e.g. missing
  # ORDER_DB_PASSWORD), this job never runs and the DROP is averted.
  needs:
    - test:unit
    - test:functional
    - deploy:order-service
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

# ─────────────────────────────────────────────────────────────
# MICROSERVICES (user-service / catalog-service)
# Own dev/test/prod: build a local FrankenPHP image, run the service's own
# phpunit (SQLite), and deploy in-place under the monolith tree (the monolith
# deploy already rsynced services/ → $DEPLOY_DIR/services/<svc>). Reached over
# the shared task-25_default network by name; no public ports in prod.
# ─────────────────────────────────────────────────────────────

build:catalog-service:
  stage: build
  script:
    - docker build -f services/catalog-service/Dockerfile
      -t printzone/catalog-service:$CI_COMMIT_SHA
      -t printzone/catalog-service:latest
      services/catalog-service
  needs: []
  rules: *rules_mr_develop

build:user-service:
  stage: build
  script:
    - docker build -f services/user-service/Dockerfile
      -t printzone/user-service:$CI_COMMIT_SHA
      -t printzone/user-service:latest
      services/user-service
  needs: []
  rules: *rules_mr_develop

build:order-service:
  stage: build
  script:
    - docker build -f services/order-service/Dockerfile
      -t printzone/order-service:$CI_COMMIT_SHA
      -t printzone/order-service:latest
      services/order-service
  needs: []
  rules: *rules_mr_develop

test:catalog-service:
  stage: test
  needs:
    - build:catalog-service
  script:
    - docker volume create composer-cache-task25 || true
    - docker run --rm
      -v "$CI_PROJECT_DIR/services/catalog-service:/app"
      -v "composer-cache-task25:/composer-cache"
      -w /app
      -e COMPOSER_HOME=/composer-cache
      printzone/catalog-service:latest
      sh -c "composer install --no-interaction --prefer-dist --optimize-autoloader && vendor/bin/phpunit --colors=never"
  rules: *rules_mr_develop

test:user-service:
  stage: test
  needs:
    - build:user-service
  script:
    - docker volume create composer-cache-task25 || true
    - docker run --rm
      -v "$CI_PROJECT_DIR/services/user-service:/app"
      -v "composer-cache-task25:/composer-cache"
      -w /app
      -e COMPOSER_HOME=/composer-cache
      printzone/user-service:latest
      sh -c "composer install --no-interaction --prefer-dist --optimize-autoloader && vendor/bin/phpunit --colors=never"
  rules: *rules_mr_develop

test:order-service:
  stage: test
  needs:
    - build:order-service
  script:
    - docker volume create composer-cache-task25 || true
    - docker run --rm
      -v "$CI_PROJECT_DIR/services/order-service:/app"
      -v "composer-cache-task25:/composer-cache"
      -w /app
      -e COMPOSER_HOME=/composer-cache
      printzone/order-service:latest
      sh -c "composer install --no-interaction --prefer-dist --optimize-autoloader && vendor/bin/phpunit --colors=never"
  rules: *rules_mr_develop

deploy:catalog-service:
  stage: deploy
  timeout: 20 minutes
  environment:
    name: production
    url: https://e-commerce.it.com
  variables:
    CSVC: "docker compose -f compose.yaml -f compose.prod.yaml"
  script:
    - cd "$DEPLOY_DIR/services/catalog-service"
    - echo "--- Starting db-catalog ---"
    - $CSVC up -d db-catalog
    - |
      i=0
      until $CSVC exec -T db-catalog pg_isready -U app -d catalog_service -q; do
        i=$((i+1)); [ $i -ge 30 ] && { echo "ERROR: db-catalog not ready"; $CSVC logs db-catalog --tail=20; exit 1; }
        echo "Waiting for db-catalog ($i/30)..."; sleep 2
      done
    - $CSVC exec -T db-catalog psql -U app -d catalog_service -c "ALTER USER app WITH PASSWORD '${CATALOG_DB_PASSWORD}';"
    - echo "--- Starting service (pre-built image) ---"
    - $CSVC up -d --no-build
    - $CSVC exec -T catalog-service composer install --no-dev --no-interaction --no-scripts --prefer-dist --optimize-autoloader
    # Rebuild the prod cache (persisted in csvc_var) so newly installed bundles
    # (e.g. fixtures) register their console commands before we use them. prod
    # does not auto-rebuild a stale cache.
    - $CSVC exec -T catalog-service php bin/console cache:clear --env=prod
    - echo "--- Migrations ---"
    - $CSVC exec -T catalog-service php bin/console doctrine:migrations:migrate --no-interaction
    - echo "--- Seed only if empty (catalog is source of truth) ---"
    - |
      COUNT=$($CSVC exec -T db-catalog psql -U app -d catalog_service -tAc "SELECT count(*) FROM products" 2>/dev/null | tr -d '[:space:]')
      if [ -z "$COUNT" ] || [ "$COUNT" = "0" ]; then
        echo "Empty catalog — loading fixtures"; $CSVC exec -T catalog-service php bin/console doctrine:fixtures:load --no-interaction
      else
        echo "Catalog has $COUNT products — skip seeding"
      fi
    - echo "--- Health check ---"
    - |
      i=0
      until $CSVC exec -T catalog-service php bin/console about > /dev/null 2>&1; do
        i=$((i+1)); [ $i -ge 15 ] && { echo "ERROR: catalog-service health failed"; $CSVC logs catalog-service --tail=20; exit 1; }
        echo "Health attempt $i/15..."; sleep 2
      done
      echo "catalog-service healthy"
  needs:
    - test:catalog-service
    - deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy:user-service:
  stage: deploy
  timeout: 20 minutes
  environment:
    name: production
    url: https://e-commerce.it.com
  variables:
    USVC: "docker compose -f compose.yaml -f compose.prod.yaml"
  script:
    - cd "$DEPLOY_DIR/services/user-service"
    - echo "--- Starting db-user ---"
    - $USVC up -d db-user
    - |
      i=0
      until $USVC exec -T db-user pg_isready -U app -d user_service -q; do
        i=$((i+1)); [ $i -ge 30 ] && { echo "ERROR: db-user not ready"; $USVC logs db-user --tail=20; exit 1; }
        echo "Waiting for db-user ($i/30)..."; sleep 2
      done
    - $USVC exec -T db-user psql -U app -d user_service -c "ALTER USER app WITH PASSWORD '${USER_DB_PASSWORD}';"
    - echo "--- Starting service (pre-built image) ---"
    - $USVC up -d --no-build
    - $USVC exec -T user-service composer install --no-dev --no-interaction --no-scripts --prefer-dist --optimize-autoloader
    # Rebuild the prod cache (persisted in usvc_var) so newly installed bundles
    # (e.g. fixtures) register their console commands before we use them. prod
    # does not auto-rebuild a stale cache.
    - $USVC exec -T user-service php bin/console cache:clear --env=prod
    - echo "--- Migrations ---"
    - $USVC exec -T user-service php bin/console doctrine:migrations:migrate --no-interaction
    - echo "--- Seed only if empty ---"
    - |
      COUNT=$($USVC exec -T db-user psql -U app -d user_service -tAc "SELECT count(*) FROM users" 2>/dev/null | tr -d '[:space:]')
      if [ -z "$COUNT" ] || [ "$COUNT" = "0" ]; then
        echo "Empty users — loading fixtures"; $USVC exec -T user-service php bin/console doctrine:fixtures:load --no-interaction
      else
        echo "Users table has $COUNT rows — skip seeding"
      fi
    - echo "--- Health check ---"
    - |
      i=0
      until $USVC exec -T user-service php bin/console about > /dev/null 2>&1; do
        i=$((i+1)); [ $i -ge 15 ] && { echo "ERROR: user-service health failed"; $USVC logs user-service --tail=20; exit 1; }
        echo "Health attempt $i/15..."; sleep 2
      done
      echo "user-service healthy"
  needs:
    - test:user-service
    - deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy:order-service:
  stage: deploy
  timeout: 20 minutes
  environment:
    name: production
    url: https://e-commerce.it.com
  variables:
    OSVC: "docker compose -f compose.yaml -f compose.prod.yaml"
  script:
    # Fail fast (before the monolith DROP, which needs this job) if the DB
    # password is missing — otherwise order-service comes up unreachable.
    - |
      if [ -z "$ORDER_DB_PASSWORD" ]; then
        echo "ERROR: ORDER_DB_PASSWORD is not set. Aborting before the monolith DROP."; exit 1
      fi
    - cd "$DEPLOY_DIR/services/order-service"
    - echo "--- Starting db-order ---"
    - $OSVC up -d db-order
    - |
      i=0
      until $OSVC exec -T db-order pg_isready -U app -d order_service -q; do
        i=$((i+1)); [ $i -ge 30 ] && { echo "ERROR: db-order not ready"; $OSVC logs db-order --tail=20; exit 1; }
        echo "Waiting for db-order ($i/30)..."; sleep 2
      done
    - $OSVC exec -T db-order psql -U app -d order_service -c "ALTER USER app WITH PASSWORD '${ORDER_DB_PASSWORD}';"
    - echo "--- Starting service + relay (pre-built image) ---"
    - $OSVC up -d --no-build
    - $OSVC exec -T order-service composer install --no-dev --no-interaction --no-scripts --prefer-dist --optimize-autoloader
    # Rebuild the prod cache (persisted in osvc_var) so the container is warm
    # before migrations/health; prod does not auto-rebuild a stale cache.
    - $OSVC exec -T order-service php bin/console cache:clear --env=prod
    - echo "--- Migrations ---"
    - $OSVC exec -T order-service php bin/console doctrine:migrations:migrate --no-interaction
    # Orders are created at runtime — no seeding in prod.
    - echo "--- Health check ---"
    - |
      i=0
      until $OSVC exec -T order-service php bin/console about > /dev/null 2>&1; do
        i=$((i+1)); [ $i -ge 15 ] && { echo "ERROR: order-service health failed"; $OSVC logs order-service --tail=20; exit 1; }
        echo "Health attempt $i/15..."; sleep 2
      done
      echo "order-service healthy"
  # Deploy order-service FIRST (independently of the monolith), so it is live
  # and healthy before the monolith cutover drops its order tables.
  needs:
    - test:order-service
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
