stages:
  - validate
  - build
  - test
  - deploy

default:
  tags:
    - Веб-разработка

variables:
  DEPLOY_DIR: /var/www/app
  DEPLOY_USER: deploy
  PHP_IMAGE: php:8.2-cli-alpine
  COMPOSE: "docker compose -f compose.yaml -f compose.prod.yaml"
  GIT_CLEAN_FLAGS: -ffd
  LOCAL_IMAGE: task-25/php:latest

# ─────────────────────────────────────────────────────────────
# VALIDATE
# Швидкі статичні перевірки — один docker run з PHP_IMAGE
# ─────────────────────────────────────────────────────────────

lint:php:
  stage: validate
  script:
    - echo "=== PHP syntax check ==="
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -w /app \
        $PHP_IMAGE \
        sh -c "find src tests -name '*.php' | xargs php -l | grep -v 'No syntax errors' || true && echo 'All files OK'"
    - echo "=== Validating composer.json ==="
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -w /app \
        $PHP_IMAGE \
        php -r "
          \$json = file_get_contents('composer.json');
          json_decode(\$json);
          if (json_last_error() !== JSON_ERROR_NONE) { fwrite(STDERR, 'composer.json: invalid JSON\n'); exit(1); }
          echo 'composer.json: valid JSON' . PHP_EOL;
        "
  only:
    - develop

# ─────────────────────────────────────────────────────────────
# BUILD
# Збираємо локальний образ паралельно з validate (needs: [])
# ─────────────────────────────────────────────────────────────

build:image:
  stage: build
  script:
    - echo "=== Building PHP image locally ==="
    - docker build
      -f Dockerfile.php
      -t task-25/php:$CI_COMMIT_SHA
      -t task-25/php:latest
      --cache-from task-25/php:latest
      .
    - echo "Image built task-25/php:$CI_COMMIT_SHA"
  needs: []
  only:
    - develop

# ─────────────────────────────────────────────────────────────
# TEST
# Використовує локальний образ — жодного pull з Docker Hub
# ─────────────────────────────────────────────────────────────

.test_base:
  stage: test
  before_script:
    - docker volume create composer-cache-task24 || true
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -v "composer-cache-task24:/composer-cache" \
        -w /app \
        -e COMPOSER_HOME=/composer-cache \
        $LOCAL_IMAGE \
        composer install --no-interaction --no-scripts --prefer-dist --optimize-autoloader
  needs:
    - build:image
  only:
    - develop

test:unit:
  extends: .test_base
  script:
    - echo "=== Unit Tests ==="
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -v "composer-cache-task24:/composer-cache" \
        -w /app \
        -e APP_ENV=test \
        -e COMPOSER_HOME=/composer-cache \
        $LOCAL_IMAGE \
        php bin/phpunit --testsuite Unit --colors=never

test:functional:
  extends: .test_base
  script:
    - echo "=== Functional Tests (SQLite) ==="
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -v "composer-cache-task24:/composer-cache" \
        -w /app \
        -e APP_ENV=test \
        -e COMPOSER_HOME=/composer-cache \
        $LOCAL_IMAGE \
        php bin/phpunit --testsuite Functional --colors=never

# ─────────────────────────────────────────────────────────────
# DEPLOY
# ─────────────────────────────────────────────────────────────

deploy:
  stage: deploy
  timeout: 10 minutes
  environment:
    name: production
    url: https://e-commerce.it.com
  script:
    - echo "=== Deploying to $DEPLOY_DIR ==="

    - rsync -a --delete
      --exclude='.git'
      --exclude='.env.local'
      --exclude='vendor'
      --exclude='node_modules'
      --exclude='var/'
      --exclude='tests/'
      "$CI_PROJECT_DIR/" "$DEPLOY_DIR/"

    - cd "$DEPLOY_DIR"

    - set -a && source .env.local && set +a

    - echo "--- Starting primary database ---"
    - $COMPOSE up -d database
    - |
      i=0
      until $COMPOSE exec -T database pg_isready -U app -q; do
        i=$((i+1))
        if [ $i -ge 30 ]; then
          echo "ERROR: Primary DB not ready after 60s"
          $COMPOSE logs database --tail=30
          exit 1
        fi
        echo "Waiting for DB ($i/30)..."
        sleep 2
      done
      echo "Primary DB is ready"

    - echo "--- Starting all services ---"
    - $COMPOSE up -d

    - echo "--- Installing dependencies ---"
    - $COMPOSE exec -T php composer install
      --no-interaction --no-scripts --prefer-dist --optimize-autoloader

    - |
      i=0
      until $COMPOSE exec -T database-replica pg_isready -U app -q; do
        i=$((i+1))
        if [ $i -ge 40 ]; then
          echo "WARNING: Replica not ready after 2min — continuing"
          $COMPOSE logs database-replica --tail=20
          break
        fi
        echo "Waiting for replica ($i/40)..."
        sleep 3
      done

    - echo "--- Running migrations ---"
    - $COMPOSE exec -T php php bin/console doctrine:migrations:migrate --no-interaction

    - echo "--- Clearing cache ---"
    - $COMPOSE exec -T php php bin/console cache:clear --no-warmup

    - echo "--- Health check ---"
    - sleep 3
    - $COMPOSE exec -T php php bin/console about
    - echo "=== Deploy complete ==="

  needs:
    - test:unit
    - test:functional
  only:
    - develop
